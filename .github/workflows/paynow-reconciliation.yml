name: Paynow Reconciliation

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

jobs:
  reconcile:
    runs-on: ubuntu-latest

    steps:
      - name: Reconcile expired Paynow orders
        env:
          RECONCILE_URL: ${{ secrets.PAYNOW_RECONCILE_URL }}
          CRON_SECRET: ${{ secrets.PAYNOW_CRON_SECRET }}
        run: |
          set -e

          if [ -z "$RECONCILE_URL" ]; then
            echo "PAYNOW_RECONCILE_URL is not configured."
            exit 1
          fi

          if [ -z "$CRON_SECRET" ]; then
            echo "PAYNOW_CRON_SECRET is not configured."
            exit 1
          fi

          curl --fail-with-body \
            --silent \
            --show-error \
            --request POST \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            --header "Content-Type: application/json" \
            "${RECONCILE_URL}"
